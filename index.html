<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>PDF Web Viewer • Talaqqi</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- PDF.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-surface: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #27354f;
      --primary: #4f46e5;
      --primary-glow: rgba(79, 70, 229, 0.35);
      --gold: #f59e0b;
      --gold-surface: rgba(245, 158, 11, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Bar */
    header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.3s ease;
    }

    /* Mode Fullscreen Hide Header (Optional) */
    body.is-fullscreen header {
      display: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .brand-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Action Controls Group */
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }

    .btn-gold {
      background: var(--gold-surface);
      border-color: rgba(245, 158, 11, 0.35);
      color: #fbbf24;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--primary-glow);
    }
    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-icon {
      padding: 7px;
      border-radius: 8px;
    }

    /* Page Navigation Capsule */
    .page-nav {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 8px;
      gap: 4px;
    }

    .page-input {
      width: 38px;
      background: transparent;
      border: none;
      color: #fbbf24;
      font-weight: 800;
      font-size: 13px;
      text-align: center;
      outline: none;
    }

    .page-total {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Main PDF Viewer Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 16px;
      position: relative;
      width: 100%;
    }

    body.is-fullscreen main {
      padding: 0;
      height: 100vh;
      width: 100vw;
      background: #000000;
    }

    #viewer-box {
      width: 100%;
      max-width: 920px;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 540px;
      position: relative;
      transition: all 0.3s ease;
    }

    body.is-fullscreen #viewer-box {
      max-width: 100vw;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      border: none;
      border-radius: 0;
      background: #000000;
    }

    #canvas-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow: auto;
    }

    body.is-fullscreen #canvas-wrapper {
      padding: 0;
    }

    #pdf-canvas {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border-radius: 6px;
      max-width: 100%;
      height: auto;
      background: #ffffff;
      display: none;
    }

    body.is-fullscreen #pdf-canvas {
      border-radius: 0;
      box-shadow: none;
    }

    /* Empty / Upload Dropzone Screen */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      gap: 14px;
      width: 100%;
      max-width: 480px;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(79, 70, 229, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #818cf8;
      margin-bottom: 4px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .empty-sub {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .upload-btn-lg {
      background: var(--primary);
      border: none;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px var(--primary-glow);
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    .upload-btn-lg:hover {
      background: #4338ca;
      transform: translateY(-2px);
    }

    /* Floating Fullscreen Controls Bar */
    .fullscreen-floating-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 6px 14px;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 100;
      transition: opacity 0.3s ease;
    }

    body.is-fullscreen .fullscreen-floating-bar {
      display: flex;
    }

    /* Loading Overlay */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(79, 70, 229, 0.2);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Modal Unggah File */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 440px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
    }

    .dropzone {
      border: 2px dashed rgba(79, 70, 229, 0.4);
      background: rgba(79, 70, 229, 0.05);
      border-radius: 12px;
      padding: 26px 16px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .dropzone:hover {
      background: rgba(79, 70, 229, 0.1);
      border-color: var(--primary);
    }

    .url-input {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      width: 100%;
    }
    .url-input:focus {
      border-color: var(--primary);
    }

    @media (max-width: 600px) {
      .brand-title { max-width: 130px; }
      .btn span { display: none; }
      .btn-labeled span { display: inline; }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation Bar -->
  <header id="main-header">
    <div class="brand">
      <div class="brand-icon">
        <i data-lucide="file-text" style="color: #ffffff; width: 18px; height: 18px;"></i>
      </div>
      <div class="brand-title" id="doc-title">Membaca Dokumen PDF</div>
    </div>

    <!-- Action Controls -->
    <div class="controls">
      <!-- Tombol Halaman Prev -->
      <button class="btn btn-icon" onclick="prevPage()" title="Halaman Sebelumnya">
        <i data-lucide="chevron-left" style="width: 18px; height: 18px;"></i>
      </button>

      <!-- Indikator Halaman -->
      <div class="page-nav">
        <input type="number" id="page-num" class="page-input" value="1" min="1" onchange="jumpToPage(this.value)">
        <span class="page-total">/ <span id="page-count">1</span></span>
      </div>

      <!-- Tombol Halaman Next -->
      <button class="btn btn-icon" onclick="nextPage()" title="Halaman Selanjutnya">
        <i data-lucide="chevron-right" style="width: 18px; height: 18px;"></i>
      </button>

      <!-- Zoom In / Out -->
      <button class="btn btn-icon" onclick="zoomChange(-0.2)" title="Perkecil">
        <i data-lucide="zoom-out" style="width: 16px; height: 16px;"></i>
      </button>
      <button class="btn btn-icon" onclick="zoomChange(0.2)" title="Perbesar">
        <i data-lucide="zoom-in" style="width: 16px; height: 16px;"></i>
      </button>

      <!-- Tombol Fullscreen -->
      <button class="btn btn-primary btn-labeled" onclick="toggleFullScreen()" id="fullscreen-btn" title="Layar Penuh (Full Screen)">
        <i data-lucide="maximize" style="width: 15px; height: 15px;"></i>
        <span>Full Screen</span>
      </button>

      <!-- Tombol Ganti / Buka PDF -->
      <button class="btn btn-gold btn-labeled" onclick="openUploadModal()">
        <i data-lucide="upload" style="width: 15px; height: 15px;"></i>
        <span>Pilih PDF</span>
      </button>
    </div>
  </header>

  <!-- Main PDF Viewer Area -->
  <main id="main-container">
    <div id="viewer-box">
      <!-- Loading Overlay -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text" style="font-size: 13px; font-weight: 600; color: #cbd5e1;">Memuat Dokumen PDF...</div>
      </div>

      <!-- Tampilan Awal / Belum Ada File -->
      <div id="empty-state">
        <div class="empty-icon">
          <i data-lucide="file-up" style="width: 32px; height: 32px;"></i>
        </div>
        <h2 class="empty-title">Buka Dokumen PDF Anda</h2>
        <p class="empty-sub">Pilih file PDF materi, kitab, atau tajwid Anda untuk ditampilkan sebagai web page yang dapat diakses langsung.</p>
        <button class="upload-btn-lg" onclick="document.getElementById('hidden-file-input').click()">
          <i data-lucide="folder-open" style="width: 18px; height: 18px;"></i>
          Pilih File PDF
        </button>
        <input type="file" id="hidden-file-input" accept="application/pdf" style="display:none;" onchange="handleFile(event)">
      </div>

      <!-- Canvas Rendering Halaman PDF -->
      <div id="canvas-wrapper">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </div>
  </main>

  <!-- Floating Navigation Bar saat Full Screen -->
  <div class="fullscreen-floating-bar" id="fullscreen-floating-bar">
    <button class="btn btn-icon" onclick="prevPage()" title="Halaman Sebelumnya">
      <i data-lucide="chevron-left" style="width: 18px; height: 18px;"></i>
    </button>
    <div class="page-nav">
      <span id="fs-page-num" style="color:#fbbf24; font-weight:800; font-size:13px;">1</span>
      <span class="page-total">/ <span id="fs-page-count">1</span></span>
    </div>
    <button class="btn btn-icon" onclick="nextPage()" title="Halaman Selanjutnya">
      <i data-lucide="chevron-right" style="width: 18px; height: 18px;"></i>
    </button>
    <button class="btn btn-icon" onclick="zoomChange(0.2)" title="Perbesar">
      <i data-lucide="zoom-in" style="width: 16px; height: 16px;"></i>
    </button>
    <button class="btn btn-icon" onclick="zoomChange(-0.2)" title="Perkecil">
      <i data-lucide="zoom-out" style="width: 16px; height: 16px;"></i>
    </button>
    <button class="btn btn-primary" onclick="toggleFullScreen()" title="Keluar Full Screen">
      <i data-lucide="minimize" style="width: 15px; height: 15px;"></i>
      <span>Keluar</span>
    </button>
  </div>

  <!-- Modal Pilih PDF / Masukkan URL -->
  <div class="modal-overlay" id="upload-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <i data-lucide="file-text" style="color:var(--gold);"></i>
          <span class="modal-title">Ganti File Dokumen PDF</span>
        </div>
        <button class="btn btn-icon" onclick="closeUploadModal()">
          <i data-lucide="x" style="width:18px; height:18px;"></i>
        </button>
      </div>

      <div class="dropzone" onclick="document.getElementById('modal-file-input').click()">
        <i data-lucide="upload-cloud" style="width: 32px; height: 32px; color: #818cf8;"></i>
        <div style="font-weight: 700; font-size: 13.5px;">Pilih File PDF dari Perangkat</div>
        <div style="font-size: 11.5px; color: var(--text-muted);">Klik untuk memilih dokumen .pdf</div>
        <input type="file" id="modal-file-input" accept="application/pdf" style="display:none;" onchange="handleFile(event)">
      </div>

      <div style="display:flex; align-items:center; gap:10px; margin: 4px 0;">
        <div style="flex:1; height:1px; background:var(--border);"></div>
        <span style="font-size:11px; color:var(--text-muted); font-weight:700;">ATAU DARI LINK URL</span>
        <div style="flex:1; height:1px; background:var(--border);"></div>
      </div>

      <div style="display:flex; gap:8px;">
        <input type="url" id="url-input" class="url-input" placeholder="https://domain.com/dokumen.pdf">
        <button class="btn btn-gold" onclick="loadFromUrlInput()">
          <span>Buka</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.35;

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const emptyState = document.getElementById('empty-state');
    const pageNumInput = document.getElementById('page-num');
    const pageCountDisplay = document.getElementById('page-count');
    const fsPageNum = document.getElementById('fs-page-num');
    const fsPageCount = document.getElementById('fs-page-count');
    const docTitleDisplay = document.getElementById('doc-title');

    function showLoading(msg) {
      loadingOverlay.style.display = 'flex';
      loadingText.innerText = msg || 'Memuat...';
    }

    function hideLoading() {
      loadingOverlay.style.display = 'none';
    }

    // Render Halaman PDF ke Canvas
    function renderPage(num) {
      if (!pdfDoc) return;
      pageRendering = true;
      showLoading(`Memuat Halaman ${num}...`);

      pdfDoc.getPage(num).then(function(page) {
        // Otomatis sesuaikan skala jika di layar penuh
        let currentScale = scale;
        if (document.body.classList.contains('is-fullscreen')) {
          const unscaledViewport = page.getViewport({ scale: 1.0 });
          const fitWidth = window.innerWidth / unscaledViewport.width;
          const fitHeight = window.innerHeight / unscaledViewport.height;
          currentScale = Math.min(fitWidth, fitHeight) * (scale / 1.35);
        }

        const viewport = page.getViewport({ scale: currentScale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };

        const renderTask = page.render(renderContext);
        renderTask.promise.then(function() {
          pageRendering = false;
          hideLoading();
          emptyState.style.display = 'none';
          canvas.style.display = 'block';

          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      }).catch(function(err) {
        pageRendering = false;
        hideLoading();
        console.error('Render Page Error:', err);
      });

      pageNumInput.value = num;
      if (fsPageNum) fsPageNum.innerText = num;
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function prevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    }

    function nextPage() {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    }

    function jumpToPage(val) {
      const target = parseInt(val, 10);
      if (isNaN(target) || !pdfDoc) return;
      pageNum = Math.max(1, Math.min(target, pdfDoc.numPages));
      queueRenderPage(pageNum);
    }

    function zoomChange(delta) {
      scale = Math.max(0.6, Math.min(3.5, scale + delta));
      if (pdfDoc) {
        queueRenderPage(pageNum);
      }
    }

    // Toggle Mode Full Screen (Layar Penuh)
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          document.body.classList.add('is-fullscreen');
          lucide.createIcons();
          if (pdfDoc) renderPage(pageNum);
        }).catch(err => {
          console.warn('Gagal masuk fullscreen:', err);
          document.body.classList.toggle('is-fullscreen');
          if (pdfDoc) renderPage(pageNum);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            document.body.classList.remove('is-fullscreen');
            lucide.createIcons();
            if (pdfDoc) renderPage(pageNum);
          });
        }
      }
    }

    // Listener Perubahan Fullscreen Browser
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        document.body.classList.add('is-fullscreen');
      } else {
        document.body.classList.remove('is-fullscreen');
      }
      lucide.createIcons();
      if (pdfDoc) renderPage(pageNum);
    });

    // Keyboard Shortcuts (Arrow Left/Right, F, Escape)
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        nextPage();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevPage();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullScreen();
      } else if (e.key === '+' || e.key === '=') {
        zoomChange(0.2);
      } else if (e.key === '-') {
        zoomChange(-0.2);
      }
    });

    // Membuka Dokumen PDF
    function loadPdfDocument(source, title) {
      showLoading('Membuka Dokumen PDF...');
      
      pdfjsLib.getDocument(source).promise.then(function(loadedDoc) {
        pdfDoc = loadedDoc;
        pageCountDisplay.innerText = pdfDoc.numPages;
        if (fsPageCount) fsPageCount.innerText = pdfDoc.numPages;
        docTitleDisplay.innerText = title || 'Dokumen PDF';
        pageNum = 1;
        renderPage(pageNum);
      }).catch(function(err) {
        hideLoading();
        alert('Gagal membuka file PDF: ' + err.message);
      });
    }

    // Handler Unggah File PDF dari Input
    function handleFile(evt) {
      const file = evt.target.files[0];
      if (!file) return;

      const fileReader = new FileReader();
      fileReader.onload = function() {
        const typedArray = new Uint8Array(this.result);
        loadPdfDocument({ data: typedArray }, file.name);
        closeUploadModal();
      };
      fileReader.readAsArrayBuffer(file);
    }

    function loadFromUrlInput() {
      const url = document.getElementById('url-input').value.trim();
      if (!url) return;
      loadPdfDocument({ url: url }, url.split('/').pop() || 'Dokumen PDF Web');
      closeUploadModal();
    }

    function openUploadModal() {
      document.getElementById('upload-modal').style.display = 'flex';
    }

    function closeUploadModal() {
      document.getElementById('upload-modal').style.display = 'none';
    }

    // Deteksi Otomatis Saat Halaman Dibuka
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const pdfUrl = urlParams.get('pdf');

      if (pdfUrl) {
        loadPdfDocument({ url: pdfUrl }, pdfUrl.split('/').pop());
      } else {
        fetch('./materi.pdf', { method: 'HEAD' })
          .then(res => {
            if (res.ok) {
              loadPdfDocument('./materi.pdf', 'Modul Materi Pembelajaran');
            }
          })
          .catch(() => {});
      }
    });
  </script>
</body>
</html>
